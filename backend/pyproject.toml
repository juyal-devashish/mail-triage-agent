[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mail-triage-agent"
version = "0.1.0"
description = "Claude sorts an inbox into needs-you, worth-knowing and noise; API, CLI and evaluation"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "nh3>=0.2.17",  # sanitises email HTML before the UI renders it
]

[project.optional-dependencies]
llm = ["anthropic>=2.9"]
gmail = ["google-api-python-client>=2.140", "google-auth-oauthlib>=1.2"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
# B008: FastAPI's Depends()/Query() in defaults is the framework's documented idiom.
ignore = ["B008"]
